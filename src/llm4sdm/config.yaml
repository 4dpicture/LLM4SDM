# Text splitter configuration for conversation transcripts
preprocessor:
  chunk: True
  max_chars: 12000
  overlap_segments: 3

# When true, run one assessment per OPTION-12 item in parallel and collate.
# Avoids the failure modes of asking for a 12-item array in a single call
# (xgrammar treats minItems/maxItems and per-item required as advisory).
per_item_prompts: true
# Concurrency cap for the per-item parallel calls (12 items total).
# Matches vLLM server-side --max-num-seqs=4; anything above just queues.
max_workers: 8

default_provider: "vllm"

providers:
  ollama:
    base_url: "http://localhost:11434"
    model_name: "llama3.1"
    options:
      num_ctx: 32768
      repeat_penalty: 1.03
      # Greedy decoding for reproducibility. temperature/top_k/top_p are
      # ignored when temperature == 0, but Ollama still requires the keys.
      temperature: 0.0
      top_k: 40
      top_p: 0.9
  vllm:
    # vLLM is served externally via its OpenAI-compatible HTTP API
    # (e.g. the in-cluster k8s Service). model_name must match what
    # vLLM was launched with (`vllm serve <model>`).
    base_url: "http://localhost:8000/v1"
    api_key: "EMPTY"
    model_name: "Qwen/Qwen3.5-9B" # "google/medgemma-1.5-4b-it", "google/gemma-4-E4B-it", "johnsnowlabs/JSL-MedLlama-3-8B-v2.0"
    options:
      max_new_tokens: 4096 # Set 2048 for medllama
      repetition_penalty: 1.03
      temperature: 0.0
      top_k: 40
      top_p: 0.9
